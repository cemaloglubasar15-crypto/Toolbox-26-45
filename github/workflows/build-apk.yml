name: Build Toolbox APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Dosyalari al
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android kur
        uses: android-actions/setup-android@v3

      - name: Projeyi ZIP'ten cikar
        run: |
          mkdir project
          unzip -q Toolbox-26.45-CLEAN-ANDROID-SOURCE.zip -d project

      - name: Kaynak duzeltmesi
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("project/app/src/main/java/com/aziz/toolbox2645/OverlayService.java")
          s = p.read_text()
          marker = "private void showGive()"
          pos = s.index(marker)
          start = s.index("        new AlertDialog.Builder(this)", pos)
          end = s.index("        AlertDialog ad = new AlertDialog.Builder(this)", start)
          s = s[:start] + s[end:]
          p.write_text(s)
          PY

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: APK olustur
        working-directory: project
        run: gradle :app:assembleDebug

      - name: APK'yi yukle
        uses: actions/upload-artifact@v4
        with:
          name: Toolbox-26.45-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
