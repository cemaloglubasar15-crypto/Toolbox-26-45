name: Build Toolbox APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Dosyalari al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android kur
        uses: android-actions/setup-android@v3

      - name: ZIP dosyasini ac
        run: |
          mkdir project
          unzip -q Toolbox-26.45-CLEAN-ANDROID-SOURCE.zip -d project

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Android SDK 35 kur
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: APK olustur
        working-directory: project
        run: gradle :app:assembleDebug

      - name: APK dosyasini kaydet
        uses: actions/upload-artifact@v4
        with:
          name: Toolbox-26.45-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
