name: Build Toolbox Google Play AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Dosyalari al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android kur
        uses: android-actions/setup-android@v3

      - name: ZIP dosyasini ac
        run: |
          mkdir project
          unzip -q Toolbox-26.45-API36-GOOGLE-PLAY.zip -d project

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Android 36 kur
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Google Play AAB olustur
        working-directory: project
        run: gradle :app:bundleDebug

      - name: AAB dosyasini kaydet
        uses: actions/upload-artifact@v4
        with:
          name: Toolbox-26.45-GooglePlay-AAB
          path: project/app/build/outputs/bundle/debug/app-debug.aab
