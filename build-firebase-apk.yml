name: Build Toolbox Firebase APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Dosyalari al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android kur
        uses: android-actions/setup-android@v3

      - name: FIX3 ZIP dosyasini ac
        run: |
          mkdir project
          unzip -q Toolbox-26.45-FIX3-DRAG-CONNECTION.zip -d project

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Android API 36 kur
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: APK olustur
        working-directory: project
        run: gradle :app:assembleDebug

      - name: APK dosyasini kaydet
        uses: actions/upload-artifact@v4
        with:
          name: Toolbox-26.45-FIX3-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
